<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smile Dental Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --mint: #3CBBB1;
            --mint-light: #e8f7f6;
            --mint-dark: #2a9d94;
            --navy: #1a2332;
            --navy-soft: #243044;
            --cream: #faf8f5;
            --warm-white: #ffffff;
            --text-primary: #1a2332;
            --text-secondary: #5a6578;
            --text-muted: #8b95a5;
            --border: #e8eaed;
            --shadow-sm: 0 1px 3px rgba(26,35,50,0.06);
            --shadow-md: 0 4px 16px rgba(26,35,50,0.08);
            --shadow-lg: 0 8px 32px rgba(26,35,50,0.12);
            --radius: 16px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        .header {
            background: var(--warm-white);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            width: 42px;
            height: 42px;
            background: var(--mint);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 2px 8px rgba(60,187,177,0.3);
        }

        .header-title {
            font-family: 'DM Serif Display', serif;
            font-size: 22px;
            color: var(--navy);
            letter-spacing: -0.3px;
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #34c759;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.3); }
        }

        /* ── Chat Container ── */
        .chat-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            overflow: hidden;
            padding: 24px 32px;
        }

        .chat-container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            background: var(--warm-white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        /* ── Messages ── */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 5px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        /* Welcome message */
        .welcome {
            text-align: center;
            padding: 32px 20px;
            animation: fadeUp 0.5s ease;
        }

        .welcome-icon {
            width: 64px;
            height: 64px;
            background: var(--mint-light);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 16px;
        }

        .welcome h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 22px;
            color: var(--navy);
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            max-width: 400px;
            margin: 0 auto;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }

        .quick-action {
            padding: 8px 16px;
            border: 1.5px solid var(--border);
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--warm-white);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'DM Sans', sans-serif;
        }

        .quick-action:hover {
            border-color: var(--mint);
            color: var(--mint-dark);
            background: var(--mint-light);
        }

        /* Message bubbles */
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .message.assistant .message-avatar {
            background: var(--mint-light);
        }

        .message.user .message-avatar {
            background: var(--navy);
            color: white;
            font-size: 12px;
            font-weight: 600;
        }

        .message-bubble {
            padding: 12px 16px;
            line-height: 1.6;
            font-size: 14px;
        }

        .message.assistant .message-bubble {
            background: var(--cream);
            border-radius: 4px 16px 16px 16px;
            color: var(--text-primary);
        }

        .message.user .message-bubble {
            background: var(--navy);
            border-radius: 16px 4px 16px 16px;
            color: white;
        }

        .message-bubble p { margin-bottom: 8px; }
        .message-bubble p:last-child { margin-bottom: 0; }
        .message-bubble strong { font-weight: 600; }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeUp 0.3s ease;
        }

        .typing-indicator .message-avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--mint-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .typing-dots {
            background: var(--cream);
            border-radius: 4px 16px 16px 16px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.2s ease-in-out infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ── Input Area ── */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            background: var(--warm-white);
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            padding: 12px 18px;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text-primary);
            background: var(--cream);
            outline: none;
            resize: none;
            min-height: 46px;
            max-height: 120px;
            line-height: 1.5;
            transition: border-color 0.2s ease;
        }

        .input-field:focus {
            border-color: var(--mint);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 14px;
            background: var(--mint);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--mint-dark);
            transform: scale(1.04);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
        }

        .input-hint {
            text-align: center;
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .header { padding: 0 16px; }
            .chat-wrapper { padding: 12px; }
            .messages { padding: 20px 16px; }
            .input-area { padding: 12px 16px; }
            .message { max-width: 92%; }
            .quick-actions { gap: 6px; }
            .quick-action { font-size: 12px; padding: 6px 12px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-brand">
            <div class="header-logo">🦷</div>
            <div>
                <div class="header-title">Smile Dental Studio</div>
                <div class="header-subtitle">AI Receptionist</div>
            </div>
        </div>
        <div class="header-status">
            <div class="status-dot"></div>
            Online
        </div>
    </header>

    <!-- Chat -->
    <div class="chat-wrapper">
        <div class="chat-container">
            <div class="messages" id="messages">
                <!-- Welcome -->
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">🦷</div>
                    <h2>Welcome to Smile Dental Studio</h2>
                    <p>I'm your AI receptionist. I can help you book appointments, answer questions, or check your insurance — just ask!</p>
                    <div class="quick-actions">
                        <button class="quick-action" onclick="sendQuick('I\'d like to book a cleaning')">Book a cleaning</button>
                        <button class="quick-action" onclick="sendQuick('What insurance do you accept?')">Insurance info</button>
                        <button class="quick-action" onclick="sendQuick('What are your office hours?')">Office hours</button>
                        <button class="quick-action" onclick="sendQuick('I need to reschedule my appointment')">Reschedule</button>
                    </div>
                </div>
            </div>

            <!-- Input -->
            <div class="input-area">
                <div class="input-row">
                    <textarea
                        class="input-field"
                        id="input"
                        placeholder="Type your message..."
                        rows="1"
                        onkeydown="handleKey(event)"
                        oninput="autoResize(this)"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="send()" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="input-hint">Powered by AI · Response times may vary</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        const convId = 'conv-' + Date.now();
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        let isLoading = false;

        // Enable/disable send button
        inputEl.addEventListener('input', () => {
            sendBtn.disabled = !inputEl.value.trim() || isLoading;
        });

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function sendQuick(text) {
            inputEl.value = text;
            send();
        }

        function addMessage(role, text) {
            // Hide welcome on first message
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.style.display = 'none';

            const div = document.createElement('div');
            div.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'assistant' ? '🦷' : 'You';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.innerHTML = formatText(text);

            div.appendChild(avatar);
            div.appendChild(bubble);
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function formatText(text) {
            // Convert markdown-like formatting to HTML
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typing';
            div.innerHTML = `
                <div class="message-avatar">🦷</div>
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            `;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typing');
            if (el) el.remove();
        }

        async function send() {
            const text = inputEl.value.trim();
            if (!text || isLoading) return;

            isLoading = true;
            sendBtn.disabled = true;
            inputEl.value = '';
            inputEl.style.height = 'auto';

            addMessage('user', text);
            showTyping();

            try {
                const res = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        conversation_id: convId
                    })
                });

                const data = await res.json();
                hideTyping();
                addMessage('assistant', data.reply);
            } catch (err) {
                hideTyping();
                addMessage('assistant', 'Sorry, I\'m having trouble connecting right now. Please try again or call us at (503) 555-0100.');
            }

            isLoading = false;
            sendBtn.disabled = !inputEl.value.trim();
            inputEl.focus();
        }
    </script>
</body>
</html>
